[package]
name = "sweep"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Finds junk on a Mac, shows what deleting each item would really free, and deletes what you select"
license = "MIT"
repository = "https://github.com/pdcgomes/sweep"
readme = "README.md"
keywords = ["macos", "disk-space", "cleanup", "tui", "apfs"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
libc = "0.2.190"
plist = "1.10.1"
ratatui = "0.30"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
